# ================================================
# Forex Signal Bot — Config
# Data source: OANDA Practice API (free, real-time, unlimited)
# ================================================

oanda:
  api_token: "YOUR_OANDA_API_TOKEN"   # Railway Variable mein: OANDA_API_TOKEN

telegram:
  bot_token: "YOUR_BOT_TOKEN"           # @BotFather se
  chat_id: "YOUR_CHAT_ID"              # @userinfobot se

pairs:
  - "XAU/USD"     # Gold
  - "SPX"         # S&P 500
  - "NDX"         # Nasdaq 100

cascades:
  - htf: "4h"
    ltf: "15min"
  - htf: "2h"
    ltf: "30min"
  - htf: "1h"
    ltf: "5min"

strategy:
  displacement_multiplier: 1.5
  min_displacement_candles: 2
  swing_pivot_bars: 2
  # How long a tapped order block waits for displacement + MSS, expressed in
  # LOWER-timeframe candles (so the window scales per cascade):
  #   3 candles → 5min LTF = 15 min · 15min LTF = 45 min · 30min LTF = 90 min
  # A flat minute value gave the 30min cascade less than one candle to confirm.
  signal_timeout_candles: 3
  # NOTE: `ob_mitigation` is no longer used. Order blocks are now retired only
  # when price CLOSES beyond the protective wick (see ob_detector.py). A close
  # inside the zone is treated as a tap, not an invalidation. Kept for
  # reference; changing it has no effect.
  ob_mitigation: "candle_close"
  max_obs_per_pair: 5

# OANDA Practice API — generous rate limit, real-time data
# Har 5 minute scan safely chal sakta hai
scan_interval_seconds: 300

chart:
  output_dir: "charts"
  candles_to_show: 100
